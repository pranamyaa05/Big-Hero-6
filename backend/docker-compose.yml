# docker compose up --build        then open http://localhost:8000
services:
  reform3d:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["reform3d-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  reform3d-data:
